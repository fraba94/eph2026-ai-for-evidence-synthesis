<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" role="img" aria-label="60 minutes, four parts. Expert discussion 10 min, demo 10 min, exercise on your own 30 min, structured discussion 10 min. The exercise: 1 screen (10 min, 20 records with your AI, then paste its answer into the scorer), 2 look at the errors (10 min, open 2 missed or false includes and decide why the AI got them wrong), 3 short extraction (10 min, one paper, 5 fields, a verbatim quote for each, check 2 with Ctrl+F), then 4 discuss (10 min, each person brings one error they found)." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">
