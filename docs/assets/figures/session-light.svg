<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" role="img" aria-label="60 minutes, four parts. Expert discussion 10 min, demo 10 min, small-group exercise 30 min, structured discussion 10 min. The exercise: 1 screen (10 min, 60 records, 20 in the chat track), 2 extract (12 min, a verbatim quote for every value), 3 score (8 min, compare with the human reference review), then 4 discuss (10 min)." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">
