<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-label="The core message: AI brings advantages only with AI literacy and advanced skills; without them, serious errors and loss of control">
  <title>The core message: AI brings advantages only with AI literacy and advanced skills; without them, serious errors and loss of control</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .card { fill: #F6F8FB; stroke: #DCE4EF; }
    .ink { fill: #0F2747; }
    .muted { fill: #4A5D78; }
    .blue { fill: #2E61A3; }
    .bluetxt { fill: #2E61A3; }
    .ai { fill: #E6EFFA; stroke: #B7CDEB; }
    .hu { fill: #FDF3E3; stroke: #EBC88C; }
    .hutxt { fill: #8A5A12; }
    .danger { fill: #FBE9E7; stroke: #E5A79F; }
    .dangertxt { fill: #A3301F; }
    .line { stroke: #9FB3CC; }
    .chip { fill: #FFFFFF; stroke: #C9D6E6; }
    .white { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #111C2C; stroke: #263A57; }
      .ink { fill: #E8EEF7; }
      .muted { fill: #A9B8CC; }
      .bluetxt { fill: #8DBBEB; }
      .ai { fill: #15294A; stroke: #2F4F7F; }
      .hu { fill: #2E2412; stroke: #7A5A22; }
      .hutxt { fill: #F0C47A; }
      .danger { fill: #321A18; stroke: #7D3A31; }
      .dangertxt { fill: #F2A195; }
      .line { stroke: #4D6688; }
      .chip { fill: #17253A; stroke: #2F4565; }
    }
  </style>
  <rect class="card" x="1" y="1" width="1238" height="598" rx="22" stroke-width="2"/>

  <text class="ink" x="48" y="62" font-size="26" font-weight="800">Same tools, opposite outcomes</text>
  <text class="muted" x="48" y="92" font-size="16">The advantages of AI in evidence synthesis come only with AI literacy and advanced skills.</text>
  <rect class="chip" x="48" y="262" width="220" height="96" rx="18" stroke-width="1.5"/>
  <text class="ink" x="158" y="300" font-size="17" font-weight="700" text-anchor="middle">AI tools in an</text>
  <text class="ink" x="158" y="323" font-size="17" font-weight="700" text-anchor="middle">evidence review</text>
  <path d="M268 296 C 320 296, 320 186, 372 186" fill="none" stroke="#2E61A3" stroke-width="4" stroke-linecap="round"/>
  <path d="M268 324 C 320 324, 320 434, 372 434" fill="none" stroke="#C0392B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
  <text class="bluetxt" x="384" y="134" font-size="13.5" font-weight="800" letter-spacing="1.3">WITH AI LITERACY AND ADVANCED SKILLS</text>
  <text class="dangertxt" x="384" y="494" font-size="13.5" font-weight="800" letter-spacing="1.3">WITHOUT THEM</text>
  <rect class="ai" x="372" y="148" width="262" height="92" rx="14" stroke-width="1.5"/>
  <text class="ink" x="388" y="178" font-size="14.5">Knows how it fails:</text>
  <text class="ink" x="388" y="199" font-size="14.5">context window, parsing,</text>
  <text class="ink" x="388" y="220" font-size="14.5">sampling, retrieval</text>
  <rect class="ai" x="656" y="148" width="262" height="92" rx="14" stroke-width="1.5"/>
  <text class="ink" x="672" y="178" font-size="14.5">Structured outputs, checks</text>
  <text class="ink" x="672" y="199" font-size="14.5">every value against the</text>
  <text class="ink" x="672" y="220" font-size="14.5">source, runs twice, logs</text>
  <rect class="danger" x="372" y="388" width="262" height="92" rx="14" stroke-width="1.5"/>
  <text class="ink" x="388" y="418" font-size="14.5">Trusts fluent, confident</text>
  <text class="ink" x="388" y="439" font-size="14.5">output; uploads and asks</text>
  <text class="ink" x="388" y="460" font-size="14.5">"summarise this"</text>
  <rect class="danger" x="656" y="388" width="262" height="92" rx="14" stroke-width="1.5"/>
  <text class="ink" x="672" y="418" font-size="14.5">Missed studies, invented</text>
  <text class="ink" x="672" y="439" font-size="14.5">values, silent failures</text>
  <text class="ink" x="672" y="460" font-size="14.5">reported as absence</text>
  <path d="M634 194 h22" stroke="#2E61A3" stroke-width="4" stroke-linecap="round"/>
  <path d="M918 194 h30" stroke="#2E61A3" stroke-width="4" stroke-linecap="round"/>
  <path d="M940 186 l10 8 -10 8" fill="none" stroke="#2E61A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M634 434 h22" stroke="#C0392B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M918 434 h30" stroke="#C0392B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M940 426 l10 8 -10 8" fill="none" stroke="#C0392B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="962" y="128" width="230" height="132" rx="18" fill="#2E61A3"/>
  <text class="white" x="984" y="164" font-size="20" font-weight="800">Real advantages</text>
  <text class="white" x="984" y="190" font-size="14">speed · scale · consistency</text>
  <text class="white" x="984" y="209" font-size="14">living updates</text>
  <rect x="984" y="222" width="186" height="24" rx="12" fill="#ffffff" fill-opacity="0.18"/>
  <text class="white" x="1077" y="239" font-size="12.5" font-weight="800" letter-spacing="1" text-anchor="middle">HUMAN IN THE LOOP</text>
  <rect x="962" y="368" width="230" height="132" rx="18" fill="#C0392B"/>
  <text class="white" x="984" y="404" font-size="20" font-weight="800">Serious errors</text>
  <text class="white" x="984" y="430" font-size="14">loss of control over</text>
  <text class="white" x="984" y="449" font-size="14">the review process</text>
  <rect x="984" y="462" width="186" height="24" rx="12" fill="#ffffff" fill-opacity="0.18"/>
  <text class="white" x="1077" y="479" font-size="12.5" font-weight="800" letter-spacing="1" text-anchor="middle">OUT OF THE LOOP</text>
  <line class="line" x1="48" y1="530" x2="1192" y2="530" stroke-width="1.5"/>
  <text class="ink" x="48" y="566" font-size="16" font-weight="700">The human reviewer stays responsible for every decision. The AI does not.</text>
  <text class="muted" x="1192" y="566" font-size="14" text-anchor="end">Beginners track: for learning only</text>
  </svg>
