name: Website in sync

# Check-only: fails when docs/ is out of date with the repository, and says which command fixes it.
# It never writes to the repository (no bot commits on main), so it works with protected branches.
#   - data and images copied into docs/      -> python3 docs/sync_data.py
#   - pages generated from the Markdown guides -> python3 docs/build_pages.py

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that docs/ has the current data and images
        run: python3 docs/sync_data.py --check
      - name: Install python-markdown
        run: pip install -r docs/requirements.txt
      - name: Check that the generated pages match the Markdown guides
        run: python3 docs/build_pages.py --check
