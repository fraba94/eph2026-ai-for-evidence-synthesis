<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="590" viewBox="0 0 1376 590" role="img" aria-label="Evidence review workflow: where AI can help and where a human must check">
  <title>Evidence review workflow: where AI can help and where a human must check</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .card { fill: #F6F8FB; stroke: #DCE4EF; }
    .ink { fill: #0F2747; }
    .muted { fill: #4A5D78; }
    .blue { fill: #2E61A3; }
    .bluetxt { fill: #2E61A3; }
    .ai { fill: #E6EFFA; stroke: #B7CDEB; }
    .hu { fill: #FDF3E3; stroke: #EBC88C; }
    .hutxt { fill: #8A5A12; }
    .danger { fill: #FBE9E7; stroke: #E5A79F; }
    .dangertxt { fill: #A3301F; }
    .line { stroke: #9FB3CC; }
    .chip { fill: #FFFFFF; stroke: #C9D6E6; }
    .white { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #111C2C; stroke: #263A57; }
      .ink { fill: #E8EEF7; }
      .muted { fill: #A9B8CC; }
      .bluetxt { fill: #8DBBEB; }
      .ai { fill: #15294A; stroke: #2F4F7F; }
      .hu { fill: #2E2412; stroke: #7A5A22; }
      .hutxt { fill: #F0C47A; }
      .danger { fill: #321A18; stroke: #7D3A31; }
      .dangertxt { fill: #F2A195; }
      .line { stroke: #4D6688; }
      .chip { fill: #17253A; stroke: #2F4565; }
    }
  </style>
  <rect class="card" x="1" y="1" width="1374" height="588" rx="22" stroke-width="2"/>

  <text class="ink" x="48" y="62" font-size="26" font-weight="800">Where AI can help, and where a human must check</text>
  <text class="muted" x="48" y="92" font-size="16">AI can draft and speed up each stage. A human decides, verifies against the source and stays accountable.</text>
  <text class="muted" x="48" y="150" font-size="13" font-weight="700" letter-spacing="1.4">STAGE</text>
  <g transform="translate(48 206)"><rect class="ai" width="40" height="40" rx="10" stroke-width="1.5"/><path d="M20 9 l2.6 6.6 6.6 2.6 -6.6 2.6 -2.6 6.6 -2.6 -6.6 -6.6 -2.6 6.6 -2.6z" class="blue"/><circle cx="30" cy="29" r="2.4" class="blue"/></g>
  <text class="bluetxt" x="48" y="272" font-size="17" font-weight="700">AI can</text>
  <text class="bluetxt" x="48" y="293" font-size="17" font-weight="700">help</text>
  <g transform="translate(48 346)"><rect class="hu" width="40" height="40" rx="10" stroke-width="1.5"/><circle cx="20" cy="15" r="5" fill="none" stroke="#C98A2B" stroke-width="2.4"/><path d="M10 32c0-5.5 4.5-8.5 10-8.5s10 3 10 8.5" fill="none" stroke="#C98A2B" stroke-width="2.4" stroke-linecap="round"/></g>
  <text class="hutxt" x="48" y="412" font-size="17" font-weight="700">A human</text>
  <text class="hutxt" x="48" y="433" font-size="17" font-weight="700">must check</text>
  <rect class="chip" x="196" y="124" width="176" height="48" rx="24" stroke-width="1.5"/>
  <circle cx="220" cy="148" r="14" fill="#2E61A3"/>
  <text class="white" x="220" y="153" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text class="ink" x="242" y="154" font-size="17" font-weight="700">Question</text>
  <path class="line" d="M373 148 h12" stroke-width="2" fill="none"/>
  <rect class="ai" x="196" y="196" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="210" y="226" font-size="14.5">Brainstorm PICO</text>
  <text class="ink" x="210" y="247" font-size="14.5">terms and synonyms</text>
  <text class="ink" x="210" y="268" font-size="14.5">Spot scope gaps</text>
  <rect class="hu" x="196" y="336" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="210" y="366" font-size="14.5">Owns the question</text>
  <text class="ink" x="210" y="387" font-size="14.5">Sets eligibility</text>
  <text class="ink" x="210" y="408" font-size="14.5">criteria a priori</text>
  <rect class="chip" x="386" y="124" width="176" height="48" rx="24" stroke-width="1.5"/>
  <circle cx="410" cy="148" r="14" fill="#2E61A3"/>
  <text class="white" x="410" y="153" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text class="ink" x="432" y="154" font-size="17" font-weight="700">Search</text>
  <path class="line" d="M563 148 h12" stroke-width="2" fill="none"/>
  <rect class="ai" x="386" y="196" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="400" y="226" font-size="14.5">Draft Boolean strings</text>
  <text class="ink" x="400" y="247" font-size="14.5">Translate syntax</text>
  <text class="ink" x="400" y="268" font-size="14.5">across databases</text>
  <rect class="hu" x="386" y="336" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="400" y="366" font-size="14.5">Runs the search</text>
  <text class="ink" x="400" y="387" font-size="14.5">Tests known studies</text>
  <text class="ink" x="400" y="408" font-size="14.5">Peer review (PRESS)</text>
  <rect class="chip" x="576" y="124" width="176" height="48" rx="24" stroke-width="1.5"/>
  <circle cx="600" cy="148" r="14" fill="#2E61A3"/>
  <text class="white" x="600" y="153" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text class="ink" x="622" y="154" font-size="17" font-weight="700">Screen</text>
  <path class="line" d="M753 148 h12" stroke-width="2" fill="none"/>
  <rect class="ai" x="576" y="196" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="590" y="226" font-size="14.5">Pre-screen titles</text>
  <text class="ink" x="590" y="247" font-size="14.5">and abstracts</text>
  <text class="ink" x="590" y="268" font-size="14.5">Act as a second</text>
  <text class="ink" x="590" y="289" font-size="14.5">screener</text>
  <rect class="hu" x="576" y="336" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="590" y="366" font-size="14.5">Makes final calls</text>
  <text class="ink" x="590" y="387" font-size="14.5">Audits exclusions</text>
  <text class="ink" x="590" y="408" font-size="14.5">Measures recall</text>
  <rect class="chip" x="766" y="124" width="176" height="48" rx="24" stroke-width="1.5"/>
  <circle cx="790" cy="148" r="14" fill="#2E61A3"/>
  <text class="white" x="790" y="153" font-size="14" font-weight="700" text-anchor="middle">4</text>
  <text class="ink" x="812" y="154" font-size="17" font-weight="700">Extract</text>
  <path class="line" d="M943 148 h12" stroke-width="2" fill="none"/>
  <rect class="ai" x="766" y="196" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="780" y="226" font-size="14.5">Draft values from</text>
  <text class="ink" x="780" y="247" font-size="14.5">full texts, with</text>
  <text class="ink" x="780" y="268" font-size="14.5">verbatim quotes</text>
  <rect class="hu" x="766" y="336" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="780" y="366" font-size="14.5">Designs the form first</text>
  <text class="ink" x="780" y="387" font-size="14.5">Verifies every value</text>
  <text class="ink" x="780" y="408" font-size="14.5">against the source</text>
  <rect class="chip" x="956" y="124" width="176" height="48" rx="24" stroke-width="1.5"/>
  <circle cx="980" cy="148" r="14" fill="#2E61A3"/>
  <text class="white" x="980" y="153" font-size="14" font-weight="700" text-anchor="middle">5</text>
  <text class="ink" x="1002" y="154" font-size="17" font-weight="700">Synthesise</text>
  <path class="line" d="M1133 148 h12" stroke-width="2" fill="none"/>
  <rect class="ai" x="956" y="196" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="970" y="226" font-size="14.5">Draft summary tables</text>
  <text class="ink" x="970" y="247" font-size="14.5">Write analysis code</text>
  <rect class="hu" x="956" y="336" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="970" y="366" font-size="14.5">Judges heterogeneity</text>
  <text class="ink" x="970" y="387" font-size="14.5">and certainty</text>
  <text class="ink" x="970" y="408" font-size="14.5">Interprets results</text>
  <rect class="chip" x="1146" y="124" width="176" height="48" rx="24" stroke-width="1.5"/>
  <circle cx="1170" cy="148" r="14" fill="#2E61A3"/>
  <text class="white" x="1170" y="153" font-size="14" font-weight="700" text-anchor="middle">6</text>
  <text class="ink" x="1192" y="154" font-size="17" font-weight="700">Report</text>
  <rect class="ai" x="1146" y="196" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="1160" y="226" font-size="14.5">Language editing</text>
  <text class="ink" x="1160" y="247" font-size="14.5">Checklist support</text>
  <text class="ink" x="1160" y="268" font-size="14.5">(e.g. PRISMA)</text>
  <rect class="hu" x="1146" y="336" width="176" height="120" rx="14" stroke-width="1.5"/>
  <text class="ink" x="1160" y="366" font-size="14.5">Is accountable</text>
  <text class="ink" x="1160" y="387" font-size="14.5">Discloses AI use,</text>
  <text class="ink" x="1160" y="408" font-size="14.5">model and version</text>
  <rect class="danger" x="48" y="484" width="1280" height="64" rx="14" stroke-width="1.5"/>
  <g transform="translate(70 500)"><path d="M16 2 L31 28 H1 Z" fill="#C0392B"/><rect x="14.6" y="10" width="2.8" height="9" rx="1.4" fill="#fff"/><circle cx="16" cy="23.2" r="1.7" fill="#fff"/></g>
  <text class="dangertxt" x="118" y="515" font-size="15" font-weight="700">Red flags at every stage</text>
  <text class="ink" x="118" y="536" font-size="14.5">Invented studies or values · retrieval failures reported as "not reported" · different answers on a second run · undocumented model or version</text>
  </svg>
