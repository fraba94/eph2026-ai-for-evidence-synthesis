<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-label="Two tracks: agent track for Claude Code and other coding agents, chat track for AI beginners (learning only)">
  <title>Two tracks: agent track for Claude Code and other coding agents, chat track for AI beginners (learning only)</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .card { fill: #F6F8FB; stroke: #DCE4EF; }
    .ink { fill: #0F2747; }
    .muted { fill: #4A5D78; }
    .blue { fill: #2E61A3; }
    .bluetxt { fill: #2E61A3; }
    .ai { fill: #E6EFFA; stroke: #B7CDEB; }
    .hu { fill: #FDF3E3; stroke: #EBC88C; }
    .hutxt { fill: #8A5A12; }
    .danger { fill: #FBE9E7; stroke: #E5A79F; }
    .dangertxt { fill: #A3301F; }
    .line { stroke: #9FB3CC; }
    .chip { fill: #FFFFFF; stroke: #C9D6E6; }
    .white { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #111C2C; stroke: #263A57; }
      .ink { fill: #E8EEF7; }
      .muted { fill: #A9B8CC; }
      .bluetxt { fill: #8DBBEB; }
      .ai { fill: #15294A; stroke: #2F4F7F; }
      .hu { fill: #2E2412; stroke: #7A5A22; }
      .hutxt { fill: #F0C47A; }
      .danger { fill: #321A18; stroke: #7D3A31; }
      .dangertxt { fill: #F2A195; }
      .line { stroke: #4D6688; }
      .chip { fill: #17253A; stroke: #2F4565; }
    }
  </style>
  <rect class="card" x="1" y="1" width="1238" height="638" rx="22" stroke-width="2"/>

  <text class="ink" x="48" y="62" font-size="26" font-weight="800">Choose your path</text>
  <text class="muted" x="48" y="92" font-size="16">Same records, same reference review, two ways to work.</text>
  <rect class="chip" x="48" y="120" width="560" height="400" rx="18" stroke-width="1.5"/>
  <path d="M48 138 a18 18 0 0 1 18 -18 h524 a18 18 0 0 1 18 18 v74 h-560 z" fill="#0F2747"/>
  <text x="76" y="162" font-size="23" font-weight="800" fill="#FFFFFF">Agent track</text>
  <text x="76" y="188" font-size="14.5" fill="#FFFFFF" fill-opacity="0.85">Claude Code or another coding agent</text>
  <g transform="translate(538 142)" fill="none" stroke="#7FB3E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="44" height="36" rx="6"/><path d="M10 12l7 6-7 6M22 25h12"/></g>
  <circle cx="92" cy="244" r="16" fill="#2E61A3"/>
  <text x="92" y="249.5" font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text>
  <path class="line" d="M92 264 v24" stroke-width="2"/>
  <text class="ink" x="124" y="242" font-size="16.5" font-weight="700">Clone the repository</text>
  <text class="muted" x="124" y="263" font-size="14">open the folder with Claude Code</text>
  <circle cx="92" cy="308" r="16" fill="#2E61A3"/>
  <text x="92" y="313.5" font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text>
  <path class="line" d="M92 328 v24" stroke-width="2"/>
  <text class="ink" x="124" y="306" font-size="16.5" font-weight="700">Skills load automatically</text>
  <text class="muted" x="124" y="327" font-size="14">from .claude/skills/ in the repo</text>
  <circle cx="92" cy="372" r="16" fill="#2E61A3"/>
  <text x="92" y="377.5" font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text>
  <path class="line" d="M92 392 v24" stroke-width="2"/>
  <text class="ink" x="124" y="370" font-size="16.5" font-weight="700">Run screening and extraction</text>
  <text class="muted" x="124" y="391" font-size="14">on activity/data/, structured output</text>
  <circle cx="92" cy="436" r="16" fill="#2E61A3"/>
  <text x="92" y="441.5" font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">4</text>
  <text class="ink" x="124" y="434" font-size="16.5" font-weight="700">Score against the reference</text>
  <text class="muted" x="124" y="455" font-size="14">activity/tools/ or the web scorer</text>
  <line class="line" x1="76" y1="480" x2="580" y2="480" stroke-width="1" stroke-dasharray="3 4"/>
  <text class="bluetxt" x="76" y="505" font-size="14" font-weight="700">Needs AI literacy and advanced skills</text>
  <rect class="chip" x="632" y="120" width="560" height="400" rx="18" stroke-width="1.5"/>
  <path d="M632 138 a18 18 0 0 1 18 -18 h524 a18 18 0 0 1 18 18 v74 h-560 z" fill="#E8A33D"/>
  <text x="660" y="162" font-size="23" font-weight="800" fill="#0F2747">Chat track</text>
  <text x="660" y="188" font-size="14.5" fill="#0F2747" fill-opacity="0.85">Any chat assistant, no install</text>
  <rect x="1022" y="146" width="146" height="28" rx="14" fill="#0F2747"/>
  <text x="1095" y="165" font-size="12.5" font-weight="800" letter-spacing="1.2" fill="#E8A33D" text-anchor="middle">LEARNING ONLY</text>
  <circle cx="676" cy="244" r="16" fill="#E8A33D"/>
  <text x="676" y="249.5" font-size="15" font-weight="800" text-anchor="middle" fill="#0F2747">1</text>
  <path class="line" d="M676 264 v24" stroke-width="2"/>
  <text class="ink" x="708" y="242" font-size="16.5" font-weight="700">Open the beginners guide</text>
  <text class="muted" x="708" y="263" font-size="14">beginners/README.md</text>
  <circle cx="676" cy="308" r="16" fill="#E8A33D"/>
  <text x="676" y="313.5" font-size="15" font-weight="800" text-anchor="middle" fill="#0F2747">2</text>
  <path class="line" d="M676 328 v24" stroke-width="2"/>
  <text class="ink" x="708" y="306" font-size="16.5" font-weight="700">Copy and paste the prompts</text>
  <text class="muted" x="708" y="327" font-size="14">ChatGPT, Claude, Gemini, Copilot...</text>
  <circle cx="676" cy="372" r="16" fill="#E8A33D"/>
  <text x="676" y="377.5" font-size="15" font-weight="800" text-anchor="middle" fill="#0F2747">3</text>
  <path class="line" d="M676 392 v24" stroke-width="2"/>
  <text class="ink" x="708" y="370" font-size="16.5" font-weight="700">Save your decisions</text>
  <text class="muted" x="708" y="391" font-size="14">record_id, decision, reason</text>
  <circle cx="676" cy="436" r="16" fill="#E8A33D"/>
  <text x="676" y="441.5" font-size="15" font-weight="800" text-anchor="middle" fill="#0F2747">4</text>
  <text class="ink" x="708" y="434" font-size="16.5" font-weight="700">Score in the browser</text>
  <text class="muted" x="708" y="455" font-size="14">docs/scorer.html</text>
  <line class="line" x1="660" y1="480" x2="1164" y2="480" stroke-width="1" stroke-dasharray="3 4"/>
  <text class="hutxt" x="660" y="505" font-size="14" font-weight="700">Teaching material, not a validated method</text>
  <path class="line" d="M328.0 520 v26" stroke-width="2.5" fill="none"/>
  <path class="line" d="M912.0 520 v26" stroke-width="2.5" fill="none"/>
  <path class="line" d="M328.0 546 H912.0" stroke-width="2.5" fill="none"/>
  <path class="line" d="M620.0 546 v10" stroke-width="2.5" fill="none"/>
  <rect x="190.0" y="556" width="860" height="56" rx="28" fill="#2E61A3"/>
  <text class="white" x="620.0" y="590" font-size="16" font-weight="700" text-anchor="middle">Both end the same way: compare with the human reference review, then discuss</text>
  </svg>
