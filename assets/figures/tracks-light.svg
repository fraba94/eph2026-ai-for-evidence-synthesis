<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="550" viewBox="0 0 1240 550" role="img" aria-label="Two ways to take part. Agent track (Claude Code or another coding agent; needs AI literacy and advanced skills): clone, skills load automatically, screen all 60 records and extract 3 papers, score. Chat track (any chat assistant, learning only): open the beginners guide, copy a batch and a prompt, save your decisions, score in the browser. Both end by comparing with the human reference review and discussing." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">
<title>Two ways to take part. Agent track (Claude Code or another coding agent; needs AI literacy and advanced skills): clone, skills load automatically, screen all 60 records and extract 3 papers, score. Chat track (any chat assistant, learning only): open the beginners guide, copy a batch and a prompt, save your decisions, score in the browser. Both end by comparing with the human reference review and discussing.</title>
<rect width="1240" height="550" rx="16" fill="#FFFFFF"/>
<text x="40" y="56" font-size="28" fill="#0F2747" font-weight="800">Two ways to take part</text>
<text x="40" y="88" font-size="17" fill="#4A5D78">Same records, same human reference review, two ways to work.</text>
<rect x="40" y="116" width="570" height="330" rx="16" fill="#FFFFFF" stroke="#D6E0EC" stroke-width="1.2"/>
<path d="M40 132 a16 16 0 0 1 16 -16 h538 a16 16 0 0 1 16 16 v62 h-570 z" fill="#EAF2FC" stroke="#A9C5E8" stroke-width="1.2"/>
<g transform="translate(62 138) scale(1.2500)" fill="none" stroke="#0F2747" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M6.5 9.5l3 2.5-3 2.5M12 15h5"/></g>
<text x="106" y="153" font-size="21" fill="#0F2747" font-weight="800">Agent track</text>
<text x="106" y="177" font-size="14.5" fill="#4A5D78">Claude Code or another coding agent</text>
<circle cx="76" cy="226" r="13" fill="#EAF2FC" stroke="#A9C5E8" stroke-width="1.2"/>
<text x="76" y="231" font-size="14" fill="#0F2747" font-weight="800" text-anchor="middle">1</text>
<text x="102" y="226" font-size="16" fill="#0F2747" font-weight="700">Clone the repository</text>
<text x="102" y="246" font-size="13.5" fill="#4A5D78">open the folder with Claude Code</text>
<line x1="76" y1="240" x2="76" y2="256" stroke="#A9C5E8" stroke-width="1.2"/>
<circle cx="76" cy="270" r="13" fill="#EAF2FC" stroke="#A9C5E8" stroke-width="1.2"/>
<text x="76" y="275" font-size="14" fill="#0F2747" font-weight="800" text-anchor="middle">2</text>
<text x="102" y="270" font-size="16" fill="#0F2747" font-weight="700">Skills load automatically</text>
<text x="102" y="290" font-size="13.5" fill="#4A5D78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">from .claude/skills/</text>
<line x1="76" y1="284" x2="76" y2="300" stroke="#A9C5E8" stroke-width="1.2"/>
<circle cx="76" cy="314" r="13" fill="#EAF2FC" stroke="#A9C5E8" stroke-width="1.2"/>
<text x="76" y="319" font-size="14" fill="#0F2747" font-weight="800" text-anchor="middle">3</text>
<text x="102" y="314" font-size="16" fill="#0F2747" font-weight="700">Screen and extract</text>
<text x="102" y="334" font-size="13.5" fill="#4A5D78">all 60 records, 3 papers</text>
<line x1="76" y1="328" x2="76" y2="344" stroke="#A9C5E8" stroke-width="1.2"/>
<circle cx="76" cy="358" r="13" fill="#EAF2FC" stroke="#A9C5E8" stroke-width="1.2"/>
<text x="76" y="363" font-size="14" fill="#0F2747" font-weight="800" text-anchor="middle">4</text>
<text x="102" y="358" font-size="16" fill="#0F2747" font-weight="700">Score against the reference</text>
<text x="102" y="378" font-size="13.5" fill="#4A5D78">Python scorer or web scorer</text>
<line x1="62" y1="400" x2="588" y2="400" stroke="#D6E0EC" stroke-dasharray="3 4"/>
<text x="62" y="427" font-size="14" fill="#4A5D78" font-weight="700">Needs AI literacy and advanced skills</text>
<path d="M325.0 446 V 476" stroke="#9DCFB1" stroke-width="1.6"/>
<rect x="630" y="116" width="570" height="330" rx="16" fill="#FFFFFF" stroke="#D6E0EC" stroke-width="1.2"/>
<path d="M630 132 a16 16 0 0 1 16 -16 h538 a16 16 0 0 1 16 16 v62 h-570 z" fill="#FFF7D6" stroke="#E2CD78" stroke-width="1.2"/>
<g transform="translate(652 138) scale(1.2500)" fill="none" stroke="#0F2747" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V17.5H4A1.5 1.5 0 0 1 2.5 16V7A1.5 1.5 0 0 1 4 5.5z"/><path d="M7 10h10M7 13.5h6"/></g>
<text x="696" y="153" font-size="21" fill="#0F2747" font-weight="800">Chat track</text>
<text x="696" y="177" font-size="14.5" fill="#4A5D78">any chat assistant, no installation</text>
<rect x="1050" y="141" width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E2CD78" stroke-width="1.2"/>
<text x="1114" y="160" font-size="12" fill="#0F2747" font-weight="800" text-anchor="middle" letter-spacing="1">LEARNING ONLY</text>
<circle cx="666" cy="226" r="13" fill="#FFF7D6" stroke="#E2CD78" stroke-width="1.2"/>
<text x="666" y="231" font-size="14" fill="#0F2747" font-weight="800" text-anchor="middle">1</text>
<text x="692" y="226" font-size="16" fill="#0F2747" font-weight="700">Open the beginners guide</text>
<text x="692" y="246" font-size="13.5" fill="#4A5D78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">beginners/README.md</text>
<line x1="666" y1="240" x2="666" y2="256" stroke="#E2CD78" stroke-width="1.2"/>
<circle cx="666" cy="270" r="13" fill="#FFF7D6" stroke="#E2CD78" stroke-width="1.2"/>
<text x="666" y="275" font-size="14" fill="#0F2747" font-weight="800" text-anchor="middle">2</text>
<text x="692" y="270" font-size="16" fill="#0F2747" font-weight="700">Copy a batch and a prompt</text>
<text x="692" y="290" font-size="13.5" fill="#4A5D78">records R001–R020</text>
<line x1="666" y1="284" x2="666" y2="300" stroke="#E2CD78" stroke-width="1.2"/>
<circle cx="666" cy="314" r="13" fill="#FFF7D6" stroke="#E2CD78" stroke-width="1.2"/>
<text x="666" y="319" font-size="14" fill="#0F2747" font-weight="800" text-anchor="middle">3</text>
<text x="692" y="314" font-size="16" fill="#0F2747" font-weight="700">Save your decisions</text>
<text x="692" y="334" font-size="13.5" fill="#4A5D78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">record_id, decision, reason</text>
<line x1="666" y1="328" x2="666" y2="344" stroke="#E2CD78" stroke-width="1.2"/>
<circle cx="666" cy="358" r="13" fill="#FFF7D6" stroke="#E2CD78" stroke-width="1.2"/>
<text x="666" y="363" font-size="14" fill="#0F2747" font-weight="800" text-anchor="middle">4</text>
<text x="692" y="358" font-size="16" fill="#0F2747" font-weight="700">Score in the browser</text>
<text x="692" y="378" font-size="13.5" fill="#4A5D78">nothing is uploaded</text>
<line x1="652" y1="400" x2="1178" y2="400" stroke="#D6E0EC" stroke-dasharray="3 4"/>
<text x="652" y="427" font-size="14" fill="#4A5D78" font-weight="700">Teaching material, not a validated method</text>
<path d="M915.0 446 V 476" stroke="#9DCFB1" stroke-width="1.6"/>
<rect x="140" y="476" width="960" height="50" rx="25" fill="#E8F5EC" stroke="#9DCFB1" stroke-width="1.2"/>
<g transform="translate(168 489) scale(1.0000)" fill="none" stroke="#1D6A44" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></g>
<text x="640" y="507" font-size="17" fill="#0F2747" font-weight="700" text-anchor="middle">Both end the same way: compare with the human reference review, then discuss</text>
</svg>
